<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#03040a" />
<title>Nebula Strike 3D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #03040a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scene {
    position: fixed; inset: 0; display: block;
    width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
  }

  #hud {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    padding: calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85);
  }
  .hud-tl { position: absolute; top: calc(14px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); }
  .hud-tr { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); text-align: right; }
  .hud-bl { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: calc(16px + env(safe-area-inset-left)); }
  .label {
    font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.18em; color: #4d6b8c; text-transform: uppercase;
  }
  .big {
    font: 700 26px/1.15 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #dff6ff; letter-spacing: 0.04em;
  }
  .mid {
    font: 700 15px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #7fd8ff; letter-spacing: 0.06em;
  }
  .row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .hud-bl .row { justify-content: flex-start; }
  .bar {
    width: 132px; height: 7px; border-radius: 4px; overflow: hidden;
    background: rgba(120, 170, 220, 0.16);
    box-shadow: inset 0 0 0 1px rgba(120, 170, 220, 0.22);
  }
  .hud-bl .bar { width: 108px; height: 6px; }
  .bar > i { display: block; height: 100%; width: 100%; border-radius: 4px; }
  #hudHullBar > i { background: linear-gradient(90deg, #ff6b6b, #ffb36b); }
  #hudShieldBar > i { background: linear-gradient(90deg, #4fd2ff, #8ef6ff); }
  #hudThrBar > i { background: linear-gradient(90deg, #7f8cff, #b9c6ff); }
  #hudBoostBar > i { background: linear-gradient(90deg, #ffb347, #ffe08a); }

  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 34px; height: 34px; margin: -17px 0 0 -17px; opacity: 0.85;
  }
  #crosshair b, #crosshair s, #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(142, 246, 255, 0.75);
  }
  #crosshair::before { left: 50%; top: 0; width: 1px; height: 8px; margin-left: -0.5px; }
  #crosshair::after { left: 50%; bottom: 0; width: 1px; height: 8px; margin-left: -0.5px; }
  #crosshair b { left: 0; top: 50%; width: 8px; height: 1px; margin-top: -0.5px; }
  #crosshair s { right: 0; top: 50%; width: 8px; height: 1px; margin-top: -0.5px; }
  #crosshair i {
    position: absolute; left: 50%; top: 50%; width: 3px; height: 3px;
    margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: rgba(255, 255, 255, 0.9);
  }

  #banner {
    position: absolute; left: 0; right: 0; top: 27%;
    text-align: center; opacity: 0;
    font: 800 30px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    letter-spacing: 0.24em; color: #eafcff;
    text-shadow: 0 0 26px rgba(57, 200, 255, 0.9), 0 0 60px rgba(90, 120, 255, 0.6);
  }
  #damageFlash {
    position: absolute; inset: 0; opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 40, 60, 0) 34%, rgba(255, 30, 60, 0.8) 100%);
  }
  #lockHint {
    position: absolute; left: 0; right: 0; bottom: 22%;
    text-align: center; font-size: 12.5px; letter-spacing: 0.16em;
    color: rgba(160, 200, 235, 0.75); opacity: 0; transition: opacity 0.3s ease;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 15px; text-align: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 42%, rgba(10, 16, 36, 0.62), rgba(2, 3, 9, 0.94));
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none; transition: opacity 0.22s ease;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #ovTitle {
    margin: 0; font-size: clamp(28px, 8vw, 54px); font-weight: 800;
    letter-spacing: 0.14em; line-height: 1.08;
    background: linear-gradient(180deg, #eafcff, #5ad7ff 52%, #a06bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #ovText { margin: 0; max-width: 34rem; font-size: 14.5px; line-height: 1.6; color: #a4bed9; }
  #ovText strong { color: #eafcff; font-weight: 700; }
  #ovText kbd {
    display: inline-block; padding: 1px 6px; margin: 0 1px;
    font: 600 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #cfe8ff; background: rgba(90, 140, 200, 0.18);
    border: 1px solid rgba(120, 170, 220, 0.3); border-radius: 4px;
  }
  .hint { display: block; margin-top: 11px; font-size: 12.5px; line-height: 1.6; color: #5f7c9c; }
  #ovBtn {
    margin-top: 8px; padding: 14px 36px;
    font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.14em;
    color: #04121a; cursor: pointer;
    background: linear-gradient(180deg, #8ef6ff, #39c8ff);
    border: 0; border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(142, 246, 255, 0.5), 0 10px 30px rgba(57, 200, 255, 0.35);
  }
  #ovBtn:active { transform: translateY(1px); }

  #toggles {
    position: fixed; z-index: 3;
    right: calc(14px + env(safe-area-inset-right));
    bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; gap: 8px;
  }
  #toggles button {
    padding: 8px 12px; cursor: pointer;
    font-family: inherit; font-size: 10.5px; letter-spacing: 0.12em;
    color: #7fa3c4; background: rgba(10, 18, 34, 0.72);
    border: 1px solid rgba(90, 150, 220, 0.25); border-radius: 999px;
  }
  #toggles button:active { transform: translateY(1px); }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="hud-tl">
    <div class="label">score</div>
    <div class="big" id="hudScore">0</div>
    <div class="mid" id="hudWave" style="margin-top:6px">WAVE 1</div>
  </div>

  <div class="hud-tr">
    <div class="label">hull</div>
    <div class="bar" id="hudHullBar" style="margin:5px 0 9px"><i style="width:100%"></i></div>
    <div class="label">shields</div>
    <div class="bar" id="hudShieldBar" style="margin:5px 0 9px"><i style="width:100%"></i></div>
    <div class="label" id="hudEnemies">0 CONTACTS</div>
  </div>

  <div class="hud-bl">
    <div class="row"><span class="label">thr</span><span class="bar" id="hudThrBar"><i style="width:65%"></i></span></div>
    <div class="row" style="margin-top:6px"><span class="label">boost</span><span class="bar" id="hudBoostBar"><i style="width:100%"></i></span></div>
  </div>

  <div id="crosshair"><b></b><s></s><i></i></div>
  <div id="banner"></div>
  <div id="damageFlash"></div>
  <div id="lockHint">CLICK TO CAPTURE MOUSE</div>
</div>

<div id="toggles">
  <button id="bloomBtn" type="button">BLOOM ON</button>
  <button id="soundBtn" type="button">SOUND ON</button>
</div>

<div id="overlay" class="show">
  <h1 id="ovTitle">NEBULA STRIKE 3D</h1>
  <p id="ovText"></p>
  <button id="ovBtn" type="button">LAUNCH</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
"use strict";

function boot() {
  /* ===================== tiny helpers ===================== */
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var damp = function (a, b, l, dt) { return lerp(a, b, 1 - Math.exp(-l * dt)); };
  var $ = function (id) { return document.getElementById(id); };

  var canvas = $('scene');
  var overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), ovBtn = $('ovBtn');
  var hudScore = $('hudScore'), hudWave = $('hudWave'), hudEnemies = $('hudEnemies');
  var hudHullBar = $('hudHullBar').firstChild, hudShieldBar = $('hudShieldBar').firstChild;
  var hudThrBar = $('hudThrBar').firstChild, hudBoostBar = $('hudBoostBar').firstChild;
  var bannerEl = $('banner'), flashEl = $('damageFlash'), lockHint = $('lockHint');
  var bloomBtn = $('bloomBtn'), soundBtn = $('soundBtn');

  var isTouch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  function fatal(msg) {
    ovTitle.textContent = 'CANNOT START';
    ovText.innerHTML = msg;
    ovBtn.style.display = 'none';
    overlay.classList.add('show');
  }

  /* ===================== renderer ===================== */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas, antialias: true, powerPreference: 'high-performance', stencil: false
    });
  } catch (e) {
    fatal('This game needs WebGL. Update your browser or graphics driver, then reload.');
    return;
  }
  if (!renderer.getContext()) {
    fatal('This game needs WebGL. Update your browser or graphics driver, then reload.');
    return;
  }

  var isGL2 = !!renderer.capabilities.isWebGL2;
  var maxPixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);

  renderer.setPixelRatio(maxPixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  /* everything goes through the composite pass, which does its own tone
     mapping and sRGB conversion, so the renderer's output stays linear */
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.4, 9000);
  camera.position.set(0, 9, -26);
  scene.fog = new THREE.FogExp2(0x050813, 0.00052);

  /* ===================== environment (IBL) ===================== */
  (function buildEnv() {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    var g = c.getContext('2d');
    g.fillStyle = '#04050c';
    g.fillRect(0, 0, 1024, 512);

    var blobs = [
      ['rgba(60,40,150,0.95)', 0.18, 0.36, 0.46],
      ['rgba(150,40,140,0.75)', 0.42, 0.66, 0.34],
      ['rgba(24,90,150,0.85)', 0.72, 0.30, 0.40],
      ['rgba(30,150,140,0.50)', 0.88, 0.62, 0.26]
    ];
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var grad = g.createRadialGradient(b[1] * 1024, b[2] * 512, 0, b[1] * 1024, b[2] * 512, b[3] * 1024);
      grad.addColorStop(0, b[0]);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.fillRect(0, 0, 1024, 512);
    }

    var sun = g.createRadialGradient(760, 120, 0, 760, 120, 190);
    sun.addColorStop(0, 'rgba(220,240,255,1)');
    sun.addColorStop(0.25, 'rgba(150,190,255,0.5)');
    sun.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sun;
    g.fillRect(0, 0, 1024, 512);

    try {
      var tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      tex.mapping = THREE.EquirectangularReflectionMapping;
      var pmrem = new THREE.PMREMGenerator(renderer);
      var rt = pmrem.fromEquirectangular(tex);
      scene.environment = rt.texture;
      tex.dispose();
      pmrem.dispose();
    } catch (e) {
      /* lights alone still render the scene */
    }
  })();

  /* ===================== lights ===================== */
  var keyLight = new THREE.DirectionalLight(0xcfe0ff, 2.6);
  keyLight.position.set(-0.8, 0.55, -1);
  scene.add(keyLight);

  var rimLight = new THREE.DirectionalLight(0xff7a4d, 1.1);
  rimLight.position.set(0.9, -0.35, 0.9);
  scene.add(rimLight);

  scene.add(new THREE.HemisphereLight(0x2f4a8a, 0x06040a, 0.8));

  /* ===================== sky dome ===================== */
  var skyMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: [
      'varying vec3 vDir;',
      'void main() {',
      '  vDir = position;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'precision highp float;',
      'uniform float uTime;',
      'varying vec3 vDir;',
      'float hash(vec3 p) {',
      '  p = fract(p * 0.3183099 + vec3(0.71, 0.113, 0.419));',
      '  p *= 17.0;',
      '  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));',
      '}',
      'float noise(vec3 x) {',
      '  vec3 i = floor(x);',
      '  vec3 f = fract(x);',
      '  f = f * f * (3.0 - 2.0 * f);',
      '  return mix(',
      '    mix(mix(hash(i), hash(i + vec3(1.0,0.0,0.0)), f.x),',
      '        mix(hash(i + vec3(0.0,1.0,0.0)), hash(i + vec3(1.0,1.0,0.0)), f.x), f.y),',
      '    mix(mix(hash(i + vec3(0.0,0.0,1.0)), hash(i + vec3(1.0,0.0,1.0)), f.x),',
      '        mix(hash(i + vec3(0.0,1.0,1.0)), hash(i + vec3(1.0,1.0,1.0)), f.x), f.y), f.z);',
      '}',
      'float fbm(vec3 p) {',
      '  float a = 0.5;',
      '  float s = 0.0;',
      '  for (int i = 0; i < 5; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; }',
      '  return s;',
      '}',
      'void main() {',
      '  vec3 d = normalize(vDir);',
      '  float n1 = fbm(d * 2.1 + vec3(0.0, 0.0, uTime * 0.006));',
      '  float n2 = fbm(d * 4.7 - vec3(3.0, 1.0, 0.0));',
      '  float band = smoothstep(0.34, 0.94, n1);',
      '  vec3 col = vec3(0.004, 0.006, 0.018);',
      '  col = mix(col, vec3(0.020, 0.030, 0.090), band * 0.92);',
      '  col += vec3(0.120, 0.030, 0.180) * pow(band, 2.0) * 0.62;',
      '  col += vec3(0.010, 0.080, 0.110) * pow(smoothstep(0.55, 1.0, n2), 2.0) * 0.45;',
      '  col *= 0.80 + 0.45 * n1;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n'),
    side: THREE.BackSide,
    depthWrite: false,
    fog: false
  });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), skyMat);
  sky.scale.setScalar(4200);
  sky.frustumCulled = false;
  sky.renderOrder = -10;
  scene.add(sky);

  /* ===================== stars ===================== */
  var STAR_COUNT = 2600;
  (function buildStars() {
    var pos = new Float32Array(STAR_COUNT * 3);
    var col = new Float32Array(STAR_COUNT * 3);
    var v = new THREE.Vector3();
    for (var i = 0; i < STAR_COUNT; i++) {
      var r = rand(1400, 3200);
      var u = rand(-1, 1);
      var th = rand(0, Math.PI * 2);
      var s = Math.sqrt(1 - u * u);
      v.set(Math.cos(th) * s, u, Math.sin(th) * s).multiplyScalar(r);
      pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z;

      var t = Math.random(), cr, cg, cb;
      if (t < 0.62) { cr = 0.92; cg = 0.96; cb = 1.0; }
      else if (t < 0.86) { cr = 0.72; cg = 0.84; cb = 1.0; }
      else { cr = 1.0; cg = 0.86; cb = 0.74; }
      var b = rand(0.45, 1.0);
      col[i * 3] = cr * b; col[i * 3 + 1] = cg * b; col[i * 3 + 2] = cb * b;
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    var mat = new THREE.PointsMaterial({
      size: 2.4, sizeAttenuation: false, vertexColors: true,
      transparent: true, opacity: 0.95, depthWrite: false, fog: false
    });
    var stars = new THREE.Points(geo, mat);
    stars.frustumCulled = false;
    stars.renderOrder = -9;
    stars.name = 'starField';
    scene.add(stars);
  })();
  var starField = scene.getObjectByName('starField');

  /* ===================== planet ===================== */
  var PLANET_POS = new THREE.Vector3(1500, -560, -2500);
  (function buildPlanet() {
    var planet = new THREE.Mesh(
      new THREE.SphereGeometry(760, 44, 30),
      new THREE.MeshStandardMaterial({
        color: 0x24345e, roughness: 0.95, metalness: 0.0,
        emissive: 0x070c1e, emissiveIntensity: 1.0, fog: false
      })
    );
    planet.position.copy(PLANET_POS);
    scene.add(planet);

    var atm = new THREE.Mesh(
      new THREE.SphereGeometry(806, 44, 30),
      new THREE.ShaderMaterial({
        uniforms: { uColor: { value: new THREE.Color(0x4fa8ff) } },
        vertexShader: [
          'varying vec3 vN;',
          'varying vec3 vV;',
          'void main() {',
          '  vN = normalize(normalMatrix * normal);',
          '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
          '  vV = normalize(-mv.xyz);',
          '  gl_Position = projectionMatrix * mv;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'precision highp float;',
          'uniform vec3 uColor;',
          'varying vec3 vN;',
          'varying vec3 vV;',
          'void main() {',
          '  float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.6);',
          '  gl_FragColor = vec4(uColor * f * 0.9, f);',
          '}'
        ].join('\n'),
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        transparent: true,
        depthWrite: false,
        fog: false
      })
    );
    atm.position.copy(PLANET_POS);
    scene.add(atm);
  })();

  /* ===================== player ship ===================== */
  var shipPivot = new THREE.Group();
  var shipModel = new THREE.Group();
  shipPivot.add(shipModel);
  scene.add(shipPivot);

  (function buildShip() {
    var hullMat = new THREE.MeshStandardMaterial({ color: 0xc9d4e4, metalness: 0.95, roughness: 0.26, envMapIntensity: 1.4 });
    var darkMat = new THREE.MeshStandardMaterial({ color: 0x1b2432, metalness: 0.88, roughness: 0.42, envMapIntensity: 1.0 });
    var accentMat = new THREE.MeshStandardMaterial({ color: 0x120a04, emissive: 0xff8a2b, emissiveIntensity: 2.4, metalness: 0.5, roughness: 0.5 });
    var canopyMat = new THREE.MeshStandardMaterial({ color: 0x061018, emissive: 0x2ad8ff, emissiveIntensity: 1.5, metalness: 0.6, roughness: 0.18, envMapIntensity: 1.6 });
    var glowMat = new THREE.MeshBasicMaterial({
      color: 0x8ff2ff, transparent: true, opacity: 0.9,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false
    });

    var body = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.92, 4.8, 14), hullMat);
    body.rotation.x = Math.PI / 2;
    shipModel.add(body);

    var nose = new THREE.Mesh(new THREE.ConeGeometry(0.52, 1.9, 14), hullMat);
    nose.rotation.x = Math.PI / 2;
    nose.position.z = 3.32;
    shipModel.add(nose);

    var spine = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 3.4), darkMat);
    spine.position.set(0, 0.62, -0.5);
    shipModel.add(spine);

    var canopy = new THREE.Mesh(new THREE.SphereGeometry(0.56, 18, 12), canopyMat);
    canopy.scale.set(0.92, 0.66, 1.55);
    canopy.position.set(0, 0.44, 1.0);
    shipModel.add(canopy);

    var wing = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.15, 1.45), hullMat);
    wing.position.set(0, -0.06, -0.75);
    shipModel.add(wing);

    for (var s = -1; s <= 1; s += 2) {
      var tip = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 1.1), darkMat);
      tip.position.set(s * 3.0, 0.1, -0.35);
      tip.rotation.z = s * 0.28;
      tip.rotation.y = s * -0.22;
      shipModel.add(tip);

      var stripe = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.06, 0.16), accentMat);
      stripe.position.set(s * 1.7, 0.05, -0.28);
      shipModel.add(stripe);

      var nacelle = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 1.5, 12), darkMat);
      nacelle.rotation.x = Math.PI / 2;
      nacelle.position.set(s * 1.5, -0.1, -1.7);
      shipModel.add(nacelle);

      var glow = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), glowMat);
      glow.position.set(s * 1.5, -0.1, -2.5);
      glow.scale.set(1, 1, 2.2);
      shipModel.add(glow);

      var gun = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.0, 8), darkMat);
      gun.rotation.x = Math.PI / 2;

      var grp = astGroups[a];
      for (var i = 0; i < grp.items.length; i++) {
        var it = grp.items[i];
        it.pos.addScaledVector(it.drift, dt * 0.35);
        _q.setFromAxisAngle(it.axis, it.spin * dt);
        it.quat.multiply(_q);
        if (it.pos.distanceToSquared(shipPivot.position) > 950 * 950) {
          placeAsteroid(it, shipPivot.position);
        }
        _m4.compose(it.pos, it.quat, _v2.set(it.radius, it.radius, it.radius));
        grp.mesh.setMatrixAt(i, _m4);
      }
      grp.mesh.instanceMatrix.needsUpdate = true;
    }
  }

  /* ===================== main loop ===================== */
  var lastTime = 0;
  var acc = 0, frames = 0, droppedQuality = false;

  function tick(ts) {
    if (!lastTime) lastTime = ts;
    var dt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);

    G.time += dt;

    if (G.state === 'playing') {
      updateShip(dt);
      updateWaves(dt);
      updateLasers(dt);
      updateEnemies(dt);
      updateAsteroids(dt);
      if (G.shake > 0) G.shake = Math.max(0, G.shake - 55 * dt);
    } else if (G.state === 'menu') {
      idleWorld(dt);
    }

    updateParticles(dt);
    updateShockwaves(dt);
    updateCamera(dt);

    sky.position.copy(camera.position);
    if (starField) starField.position.copy(camera.position);
    skyMat.uniforms.uTime.value = G.time;

    updateHud(dt);
    renderFrame();

    if (!droppedQuality) {
      acc += dt;
      frames++;
      if (frames >= 180) {
        var avg = acc / frames;
        acc = 0;
        frames = 0;
        if (avg > 0.026 && renderer.getPixelRatio() > 1.01) {
          droppedQuality = true;
          renderer.setPixelRatio(1);
          renderer.setSize(window.innerWidth, window.innerHeight, false);
          makeTargets();
        }
      }
    }

    requestAnimationFrame(tick);
  }

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    makeTargets();
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  /* ===================== boot ===================== */
  makeTargets();
  resetWorld();
  camera.position.set(0, 9, -26);
  camTarget.set(0, 0, 20);

  showOverlay(
    'NEBULA STRIKE 3D',
    'You are the last interceptor in the Helios belt. Break the drone waves, and put down the dreadnought that arrives every fifth wave.' +
      '<span class="hint"><kbd>Mouse</kbd> steers (click to capture) &nbsp;·&nbsp; <kbd>W</kbd> <kbd>S</kbd> throttle &nbsp;·&nbsp; <kbd>Shift</kbd> boost &nbsp;·&nbsp; <kbd>Q</kbd> <kbd>E</kbd> roll' +
      '<br>Guns fire automatically &nbsp;·&nbsp; <kbd>P</kbd> pause &nbsp;·&nbsp; <kbd>M</kbd> mute &nbsp;·&nbsp; <kbd>B</kbd> toggle bloom</span>',
    'LAUNCH'
  );

  requestAnimationFrame(tick);
}

/* three.js loads from vendor/ next to this page; a CDN copy is the fallback */
(function () {
  if (window.THREE) { boot(); return; }
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
  s.onload = function () { boot(); };
  s.onerror = function () {
    var t = document.getElementById('ovTitle');
    var x = document.getElementById('ovText');
    var b = document.getElementById('ovBtn');
    var o = document.getElementById('overlay');
    if (t) t.textContent = 'ENGINE MISSING';
    if (x) x.innerHTML = 'The file <strong>vendor/three.min.js</strong> was not found next to this page. Unzip the whole folder and keep the <strong>vendor</strong> folder beside <strong>index.html</strong>.';
    if (b) b.style.display = 'none';
    if (o) o.classList.add('show');
  };
  document.head.appendChild(s);
})();
</script>
